<!-- ACE - CORREÇÃO DA ABERTURA SEM FLASH -->
<!-- Cole este bloco no INÍCIO do <head> do arquivo www/index.html -->

<style>
  html {
    background: #064b7d !important;
  }

  html.ace-startup-loading body > *:not(#aceStartupShield) {
    visibility: hidden !important;
    opacity: 0 !important;
    pointer-events: none !important;
  }

  html.ace-startup-loading #aceStartupShield {
    visibility: visible !important;
    opacity: 1 !important;
    pointer-events: auto !important;
  }
</style>

<script>
  document.documentElement.classList.add('ace-startup-loading');
</script>
